
name: Release Publisher

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LAST_TAG" ]; then
            # No previous tags, get all commits
            COMMITS=$(git log --pretty=format:"- %s" | head -20)
          else
            # Get commits since last tag
            COMMITS=$(git log $LAST_TAG..HEAD --pretty=format:"- %s")
          fi

          # Store in output, handling multiline
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Calculate release version
        id: version
        run: |
          if ! LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null); then
            echo "::error::No previous release tag found; create an initial release tag first."
            exit 1
          fi

          if [[ "$LAST_TAG" =~ ^(v?)([0-9]+)\.([0-9]+)(\.([0-9]+))?$ ]]; then
            TAG_PREFIX="${BASH_REMATCH[1]}"
            MAJOR="${BASH_REMATCH[2]}"
            MINOR="${BASH_REMATCH[3]}"
            PATCH="${BASH_REMATCH[5]}"
            NEXT_MINOR=$((10#$MINOR + 1))
            VERSION="${MAJOR}.${NEXT_MINOR}"
            if [ -n "$PATCH" ]; then
              VERSION="${VERSION}.0"
            fi
            echo "tag=${TAG_PREFIX}${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unsupported release tag '$LAST_TAG'; expected a numeric major.minor[.patch] version."
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.commits }}
          draft: false
          prerelease: false
          tag_name: "${{ steps.version.outputs.tag }}"
